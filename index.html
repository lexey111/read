<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WebReader</title>
<meta name="theme-color" content="#f8f1e3">
<meta name="description" content="A book reader in the browser: EPUB, FB2, CBZ, Markdown, TXT and HTML. Your books stay on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="desk.css">
<link rel="stylesheet" href="desk-family.css">
<script>if (window.__TAURI__) document.documentElement.classList.add('desk');</script>
</head>
<body>
<div id="home">
    <div class="leaf">
        <header class="top">
            <label class="language"><span class="globe" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c-2.6 2.4-3.6 5.2-3.6 8.5s1 6.1 3.6 8.5M12 3.5c2.6 2.4 3.6 5.2 3.6 8.5s-1 6.1-3.6 8.5"/></svg></span><select id="homeLanguage" data-i18n-label="Language"></select></label>
            <div id="homeLight" class="segmented icons" role="radiogroup">
                <button type="button" role="radio" data-value="auto" data-i18n-label="Auto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" class="fill"/></svg></button>
                <button type="button" role="radio" data-value="day" data-i18n-label="Day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg></button>
                <button type="button" role="radio" data-value="dusk" data-i18n-label="Twilight"><svg viewBox="0 0 24 24"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg></button>
            </div>
            <div class="segmented icons home-settings"><button id="homeSettings" type="button" data-i18n-label="Reading settings" title="Reading settings" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M4 7h8.5M17.5 7H20M4 12h2.5M11.5 12H20M4 17h10.5M19.5 17h.5"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg></button></div>
        </header>

        <main id="front">
            <p class="eyebrow" data-i18n="A book reader in the browser">A book reader in the browser</p>
            <h1 aria-label="WebReader"><span class="dropcap">W</span>eb<br><em>Reader<span class="punct">.</span></em></h1>
            <div class="doors">
                <button id="open" type="button" class="prominent" data-i18n="Load a book…">Load a book…</button>
                <span class="hint" data-i18n="or drop it on the page">or drop it on the page</span>
            </div>
            <p class="notes"><span id="formats"></span><br><span data-i18n="Your books stay on your device.">Your books stay on your device.</span><span id="install" hidden><br><span class="how"></span><button type="button" class="hide" data-i18n-label="Hide">×</button></span></p>
            <p id="problem" role="alert"></p>
            <section id="shelf" class="shelf" hidden>
                <p class="label" data-i18n="Continue reading">Continue reading</p>
                <div class="cards"></div>
            </section>
            <template id="bookCard">
                <div class="resume">
                    <button type="button" class="book">
                        <span class="slot" aria-hidden="true"></span>
                        <span class="cover"><span class="initial"></span></span>
                        <span class="words">
                            <span class="name"></span>
                            <span class="author" hidden></span>
                            <span class="how-far"><span class="progress-line"><i></i></span><span class="share"></span></span>
                        </span>
                    </button>
                    <button type="button" class="forget"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
                </div>
            </template>
            <input id="file" type="file" hidden>
            <ul id="samples"></ul>
        </main>

        <section id="apps" hidden></section>
        <section id="news" hidden></section>

        <footer class="bottom">
            <a id="appsDoor" class="more" href="#apps"><span data-i18n="More in the apps">More in the apps</span> →</a>
            <a id="feedback" class="more feedback" href="https://continuousreader.app/contact.html?app=webreader" target="_blank" rel="noopener"><span data-i18n="Feedback">Feedback</span></a>
            <a id="installHow" class="more" href="https://continuousreader.app/web-reader.html#app" target="_blank" rel="noopener" hidden><span data-i18n="How to install as an app">How to install as an app</span></a>
            <button id="update" type="button" class="update" hidden><span data-i18n="A new version is ready">A new version is ready</span> · <u data-i18n="Reload">Reload</u></button>
            <a id="version" class="version" href="#news" data-i18n-label="What’s new"><span class="dot" hidden></span><span class="number"></span></a>
        </footer>
    </div>
    <div class="band" aria-hidden="true"></div>
    <img class="seal" src="icons/seal.svg" alt="" aria-hidden="true">
</div>

<div id="deskHome"></div>

<section id="reader" hidden>
    <iframe id="page" title="Book"></iframe>
    <footer id="strip">
        <div class="side">
            <button id="close" type="button" class="icon" data-i18n-label="Close the book" title="Close the book" aria-label="Close the book"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <span id="title"></span>
        </div>
        <div class="group">
            <button id="contentsDoor" type="button" class="icon" data-i18n-label="Contents" title="Contents" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
            <button id="searchDoor" type="button" class="icon" data-i18n-label="Search" data-key="⌘F" title="Search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg></button>
            <button id="marksDoor" type="button" class="icon" data-i18n-label="Marks" title="Marks" aria-label="Marks" hidden><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
            <button id="settings" type="button" class="icon" data-i18n-label="Reading settings" title="Reading settings" aria-label="Reading settings"><svg viewBox="0 0 24 24"><path d="M4 7h8.5M17.5 7H20M4 12h2.5M11.5 12H20M4 17h10.5M19.5 17h.5"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg></button>
            <div id="bar"></div>
            <span id="position"></span>
        </div>
        <div class="side end">
            <button id="fullscreen" type="button" class="icon" data-i18n-label="Full screen" data-key="F" title="Full screen (F)" aria-label="Full screen"><svg viewBox="0 0 24 24"><path class="enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="leave" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
        </div>
    </footer>
    <aside id="drawer" hidden>
        <div class="tabs" role="tablist">
            <button type="button" role="tab" data-tab="contents" data-word="Contents">Contents</button>
            <button type="button" role="tab" data-tab="search" data-word="Search">Search</button>
            <button type="button" role="tab" data-tab="marks" data-word="Marks">Marks</button>
            <button type="button" role="tab" data-tab="notes" data-word="Comment">Comment</button>
            <button type="button" role="tab" data-tab="pictures" data-word="Pictures">Pictures</button>
        </div>
        <nav id="contents" class="list" data-section="contents"></nav>
        <section class="search" data-section="search" hidden>
            <div class="field">
                <input type="search" autocomplete="off" spellcheck="false">
                <button type="button" class="icon" data-step="-1" data-i18n-label="Previous" disabled><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
                <button type="button" class="icon" data-step="1" data-i18n-label="Next" disabled><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
            <output></output>
            <div class="list"></div>
        </section>
        <section class="marks" data-section="marks" hidden></section>
        <section class="notes" data-section="notes" hidden></section>
        <section class="pictures" data-section="pictures" hidden></section>
        <form class="go"><label><span data-i18n="Go to">Go to</span><input type="text" inputmode="decimal" autocomplete="off"></label></form>
    </aside>
    <dialog id="picture" tabindex="-1"><img alt=""></dialog>
    <div id="markBar" role="toolbar" hidden></div>
    <dialog id="markEdit" class="ask" tabindex="-1"></dialog>
</section>

<dialog id="panel" tabindex="-1" aria-label="Reading settings"></dialog>
<dialog id="pdfAsk" tabindex="-1"></dialog>
<dialog id="shelfAsk" class="ask" tabindex="-1"></dialog>
<dialog id="linkAsk" class="ask" tabindex="-1"></dialog>
<div id="busy" role="status" aria-live="polite" hidden><span class="ring" aria-hidden="true"></span><span class="words"></span></div>
<script type="module" src="shell.js"></script>
</body>
</html>
